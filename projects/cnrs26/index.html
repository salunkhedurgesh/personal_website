<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CNRS 2026 Portal</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/style_publications.css">
    <link rel="stylesheet" href="/projects/cnrs26/portal.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.png" />
</head>

<body>
    <div class="content portal-page">
        <section class="portal-hero">
            <h1>CNRS 2026 access portal</h1>
        </section>

        <section class="portal-layout">
            <div class="paper portal-shell">
                <div class="paper_description portal-panel" id="loginPanel">
                    <form id="loginForm" class="portal-form">
                        <label class="portal-label" for="username">Username</label>
                        <input class="portal-input" id="username" name="username" type="text" autocomplete="username" required>

                        <label class="portal-label" for="password">Password</label>
                        <input class="portal-input" id="password" name="password" type="password" autocomplete="current-password" required>

                        <div class="portal-actions">
                            <button class="portal-button" type="submit">Unlock portal</button>
                        </div>
                        <p class="portal-message" id="loginMessage" aria-live="polite"></p>
                    </form>
                </div>

                <div class="paper_description portal-panel portal-panel-hidden" id="resourcePanel">
                    <div class="portal-files">
                        <a class="portal-file" href="/cnrs_teleprompter" target="_blank" rel="noopener noreferrer">
                            <div class="portal-file-icon">T</div>
                            <div class="portal-file-copy">
                                <span class="portal-file-name">cnrs_teleprompter.html</span>
                                <span class="portal-file-meta">Rehearsal view with pacing tools</span>
                            </div>
                        </a>
                        <a class="portal-file" href="/cnrs_presentation" target="_blank" rel="noopener noreferrer">
                            <div class="portal-file-icon">PDF</div>
                            <div class="portal-file-copy">
                                <span class="portal-file-name">CNRS26_Salunkhe_short.pdf</span>
                                <span class="portal-file-meta">Short CNRS presentation PDF</span>
                            </div>
                        </a>
                        <a class="portal-file" href="/projects/cnrs26/cnrs_presentation_speech_annotated.txt" target="_blank" rel="noopener noreferrer">
                            <div class="portal-file-icon">TXT</div>
                            <div class="portal-file-copy">
                                <span class="portal-file-name">cnrs_presentation_speech_annotated.txt</span>
                                <span class="portal-file-meta">Annotated speech text</span>
                            </div>
                        </a>
                    </div>

                    <div class="portal-actions">
                        <button class="portal-button portal-button-secondary" type="button" id="logoutButton">Lock portal</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginPanel = document.getElementById('loginPanel');
        const resourcePanel = document.getElementById('resourcePanel');
        const loginMessage = document.getElementById('loginMessage');
        const logoutButton = document.getElementById('logoutButton');
        const urlParams = new URLSearchParams(window.location.search);
        const requestedTarget = sanitizeNextPath(urlParams.get('next'));

        function sanitizeNextPath(candidate) {
            if (typeof candidate !== 'string') return '';
            if (!candidate.startsWith('/')) return '';
            if (candidate.startsWith('//')) return '';
            if (candidate.includes('/../') || candidate.endsWith('/..')) return '';
            return candidate;
        }

        function navigateToRequestedTarget() {
            if (requestedTarget) {
                window.location.assign(requestedTarget);
                return true;
            }
            return false;
        }

        function setAuthenticatedState(isAuthenticated) {
            if (isAuthenticated) {
                if (navigateToRequestedTarget()) return;
                loginPanel.classList.add('portal-panel-hidden');
                resourcePanel.classList.remove('portal-panel-hidden');
                loginMessage.textContent = '';
                return;
            }

            resourcePanel.classList.add('portal-panel-hidden');
            loginPanel.classList.remove('portal-panel-hidden');
            loginForm.reset();
            loginMessage.textContent = '';
        }

        async function syncPortalSession() {
            try {
                const response = await fetch('/cnrs26/session', { credentials: 'same-origin' });
                if (!response.ok) throw new Error('Unable to read session');
                const data = await response.json();
                setAuthenticatedState(Boolean(data.authenticated));
            } catch (error) {
                setAuthenticatedState(false);
            }
        }

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const formData = new FormData(loginForm);
            const username = String(formData.get('username') || '').trim();
            const password = String(formData.get('password') || '');

            try {
                const response = await fetch('/cnrs26/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, next: requestedTarget })
                });
                const data = await response.json();

                if (response.ok && data.ok) {
                    const redirectTarget = sanitizeNextPath(data.redirect);
                    if (redirectTarget) {
                        window.location.assign(redirectTarget);
                        return;
                    }
                    setAuthenticatedState(true);
                    return;
                }

                setAuthenticatedState(false);
                loginMessage.textContent = data.message || 'Access denied. Please check the username and password.';
            } catch (error) {
                setAuthenticatedState(false);
                loginMessage.textContent = 'Login is temporarily unavailable. Please try again.';
            }
        });

        logoutButton.addEventListener('click', async function () {
            try {
                await fetch('/cnrs26/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
            } finally {
                setAuthenticatedState(false);
            }
        });

        syncPortalSession();
    </script>
</body>

</html>
